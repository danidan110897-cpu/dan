name: Pulse
options:
  bundleIdPrefix: com.danielioja
  deploymentTarget:
    iOS: "18.0"
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Pulse:
    type: application
    platform: iOS
    sources: [Pulse, Shared, SharedLive]
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    entitlements:
      path: Pulse/Pulse.entitlements
      properties:
        com.apple.developer.healthkit: true
    dependencies:
      - target: PulseWatch
        embed: true
      - target: PulseWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danielioja.pulse
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/Pulse-Extra.plist
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: Pulse
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSCameraUsageDescription: Pulse usa la fotocamera per leggere i codici a barre dei prodotti.
        INFOPLIST_KEY_NSHealthShareUsageDescription: Pulse legge passi, sonno, HRV e battito per calcolare il tuo recupero.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: Pulse salva in Salute cibo, peso e allenamenti.
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Pulse usa il microfono per capire a voce quale allenamento vuoi fare oggi.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Pulse trascrive la tua voce per creare l'allenamento di oggi. Se il telefono lo supporta, avviene sul dispositivo.
        INFOPLIST_KEY_NSFaceIDUsageDescription: Pulse usa Face ID per proteggere i tuoi dati se attivi il blocco.
  PulseTests:
    type: bundle.unit-test
    platform: iOS
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    sources: [PulseTests]
    dependencies:
      - target: Pulse
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danielioja.pulse.tests
        GENERATE_INFOPLIST_FILE: YES
  PulseWidgets:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    sources: [PulseWidgets, SharedLive]
    info:
      path: PulseWidgets/Info.plist
      properties:
        CFBundleDisplayName: Pulse Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danielioja.pulse.widgets
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
  PulseWatch:
    type: application
    platform: watchOS
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    sources: [PulseWatch, Shared]
    entitlements:
      path: PulseWatch/PulseWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danielioja.pulse.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Pulse
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.danielioja.pulse
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
        INFOPLIST_KEY_NSHealthShareUsageDescription: Pulse legge battito e calorie per mostrarli durante l'allenamento.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: Pulse salva i tuoi allenamenti in Salute.
schemes:
  Pulse:
    build:
      targets:
        Pulse: all
    test:
      targets: [PulseTests]
