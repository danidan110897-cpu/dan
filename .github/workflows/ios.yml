name: iOS build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app || true
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$LATEST" ]; then sudo xcode-select -s "$LATEST/Contents/Developer"; fi
          xcodebuild -version
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: >
          xcodebuild build -project Pulse.xcodeproj -scheme Pulse
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
